name: Publish to ClawHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to manifest.json)"
        required: false
        default: ""
      changelog:
        description: "Changelog text"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(node -p "require('./manifest.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Verify manifest.json version matches tag
        if: github.event_name == 'push'
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - name: Resolve changelog
        id: log
        run: |
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            printf '%s' "${{ github.event.inputs.changelog }}" > .changelog.txt
          else
            git log -1 --pretty=%B > .changelog.txt
          fi
          echo "Changelog:"
          cat .changelog.txt

      - name: Login to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Publish
        run: |
          clawhub publish . \
            --slug wuli \
            --version "${{ steps.ver.outputs.version }}" \
            --changelog "$(cat .changelog.txt)"
